<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Engineering focus areas and exploring direction">
  <defs>
    <style>
      .mono { font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace; }
      .dim { fill: #8A8A8A; }
      .mid { fill: #B4B4B4; }
      .lit { fill: #EAEAEA; }
      .red { fill: #E61919; }
      .green { fill: #4AF626; }
      @keyframes blink { 0%,55% { opacity: 1; } 56%,100% { opacity: 0; } }
      .anim-blink { animation: blink 1.8s steps(1,end) infinite; }
      @media (prefers-reduced-motion: reduce) { .anim-blink { animation: none; } }
    </style>
  </defs>

  <rect width="1200" height="320" fill="#0A0A0A"/>
  <rect x="1" y="1" width="1198" height="318" fill="none" stroke="#2B2B2B"/>

  <text x="52" y="34" class="mono dim" font-size="11" letter-spacing="2">ENGINEERING</text>
  <text x="1150" y="37" text-anchor="end" class="mono red" font-size="11" letter-spacing="1.5">HOW I BUILD</text>

  <g class="mono">
    <text x="60" y="92" class="mono red" font-size="13">▸</text>
    <text x="82" y="92" class="mono lit" font-size="12.5" font-weight="600" letter-spacing="1">ARCHITECTURE</text>
    <text x="330" y="92" class="mono dim" font-size="10.5" letter-spacing="0.5">DISTRIBUTED SYSTEMS · MICROSERVICES</text>

    <text x="60" y="136" class="mono red" font-size="13">▸</text>
    <text x="82" y="136" class="mono lit" font-size="12.5" font-weight="600" letter-spacing="1">DATA</text>
    <text x="330" y="136" class="mono dim" font-size="10.5" letter-spacing="0.5">PIPELINES · DIMENSIONAL MODELS · QUALITY GATES</text>

    <text x="60" y="180" class="mono red" font-size="13">▸</text>
    <text x="82" y="180" class="mono lit" font-size="12.5" font-weight="600" letter-spacing="1">AUTOMATION</text>
    <text x="330" y="180" class="mono dim" font-size="10.5" letter-spacing="0.5">CI/CD · REPRODUCIBLE BUILDS · TESTS</text>

    <text x="60" y="224" class="mono red" font-size="13">▸</text>
    <text x="82" y="224" class="mono lit" font-size="12.5" font-weight="600" letter-spacing="1">AI</text>
    <text x="330" y="224" class="mono dim" font-size="10.5" letter-spacing="0.5">LOCAL-FIRST INFERENCE · AGENTS AS INFRASTRUCTURE</text>
  </g>

  <line x1="52" y1="252" x2="1160" y2="252" stroke="#2E2E2E"/>

  <text x="52" y="282" class="mono red" font-size="11" letter-spacing="1.5">EXPLORING //</text>
  <text x="52" y="304" class="mono dim" font-size="10.5" letter-spacing="0.5">AGENTS · LLAMA.CPP · OLLAMA · MODEL ROUTING · GRAPH-BASED AI · LATENCY</text>
  <circle cx="1128" cy="303" r="3" class="green anim-blink"/>
</svg>