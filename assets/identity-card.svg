  <text x="40" y="262" class="sans" font-size="19" fill="#B9BDC6" letter-spacing="0.3">Building software at the intersection of</text>
  <text x="40" y="292" class="sans" font-size="19" fill="#B9BDC6" letter-spacing="0.3">distributed systems, data and AI.</text>

  <text x="700" y="92" class="mono dim" font-size="10.5" letter-spacing="1.5">SIGNAL / INTENT STACK</text>
  <line x1="713" y1="112" x2="713" y2="318" stroke="#2E323A" stroke-width="1.5"/>
  <circle cx="713" cy="128" r="3" fill="#3A3E46"/>
  <circle cx="713" cy="170" r="3" fill="#3A3E46"/>
  <circle cx="713" cy="212" r="3" fill="#3A3E46"/>
  <circle cx="713" cy="254" r="3" class="amber"/>
  <circle cx="713" cy="296" r="3" class="amber"/>
  <text x="730" y="133" class="mono soft" font-size="12.5" letter-spacing="1">SOFTWARE</text>
  <text x="730" y="175" class="mono soft" font-size="12.5" letter-spacing="1">DISTRIBUTED SYSTEMS</text>
  <text x="730" y="217" class="mono soft" font-size="12.5" letter-spacing="1">DATA</text>
  <text x="730" y="259" class="mono amber" font-size="12.5" font-weight="600" letter-spacing="1">AI</text>
