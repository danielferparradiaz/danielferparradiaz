  <rect width="1200" height="430" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="428" rx="15" fill="none" class="line"/>

  <text x="40" y="34" class="mono dim" font-size="11" letter-spacing="1.2">ENGINEERING IDENTITY</text>
  <text x="1160" y="34" text-anchor="end" class="mono dim" font-size="11" letter-spacing="1.2">SOFTWARE &#215; DATA &#215; AI</text>
  <line x1="40" y1="50" x2="1160" y2="50" class="hair"/>

  <text x="40" y="124" class="sans" font-size="40" font-weight="600" letter-spacing="0.2" fill="#EAEBEE">Daniel Fernando Parra Diaz</text>

  <rect x="40" y="152" width="8" height="8" rx="2" class="amber"/>
  <text x="58" y="161" class="mono amber" font-size="13.5" font-weight="600" letter-spacing="1.2">SOFTWARE ENGINEER</text>
  <text x="40" y="186" class="mono mid" font-size="13.5" letter-spacing="1.2">DATA &amp; AI ENGINEERING STUDENT</text>

