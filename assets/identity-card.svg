  <text x="40" y="416" class="mono dim" font-size="11" letter-spacing="0.8">danielferparradiaz</text>
  <text x="1160" y="416" text-anchor="end" class="mono dim" font-size="11" letter-spacing="0.8">github.com/danielferparradiaz</text>
