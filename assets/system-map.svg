<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-label="Live topology - software to agents system map with animated data flow">
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#212121"/>
    </pattern>
    <style>
      .mono { font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace; }
      .dim { fill: #8A8A8A; }
      .lit { fill: #EAEAEA; }
      .red { fill: #E61919; }
      @keyframes chase { 0% { opacity: .12; } 35% { opacity: .95; } 70% { opacity: .12; } 100% { opacity: .12; } }
      @keyframes pulse { 0% { transform: scale(.55); opacity: .7; } 100% { transform: scale(2.6); opacity: 0; } }
      @keyframes flick { 0%,55% { opacity: 1; } 56%,100% { opacity: .15; } }
      .anim-chase { animation: chase 2.3s ease-in-out infinite; }
      .anim-pulse { animation: pulse 2.8s cubic-bezier(.2,0,0,1) infinite; transform-box: fill-box; transform-origin: center; }
      .anim-flick { animation: flick 1.4s steps(1,end) infinite; }
      @media (prefers-reduced-motion: reduce) {
        .anim-chase, .anim-pulse, .anim-flick { animation: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="460" fill="#0A0A0A"/>
  <rect width="1200" height="460" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="458" fill="none" stroke="#2B2B2B"/>

  <g stroke="#3A3A3A">
    <path d="M 34 28 h 14 M 34 28 v 14 M 34 432 h 14 M 34 432 v -14 M 1166 28 h -14 M 1166 28 v 14 M 1166 432 h -14 M 1166 432 v -14"/>
  </g>

  <text x="52" y="30" class="mono dim" font-size="10.5" letter-spacing="2">LIVE TOPOLOGY</text>
  <circle cx="1060" cy="29" r="3" class="red anim-flick"/>
  <text x="1150" y="33" text-anchor="end" class="mono red" font-size="10.5" letter-spacing="1.5">REV 4.1 / LIVE</text>

  <line x1="40" y1="52" x2="1160" y2="52" stroke="#2E2E2E"/>

  <g stroke="#3A3A3A" stroke-width="1.5">
    <line x1="200" y1="140" x2="520" y2="200"/>
    <line x1="200" y1="140" x2="200" y2="350"/>
    <line x1="520" y1="200" x2="800" y2="200"/>
    <line x1="200" y1="350" x2="800" y2="200"/>
    <line x1="800" y1="200" x2="1030" y2="200"/>
  </g>

  <g class="mono" font-size="6">
    <circle cx="238" cy="143" r="2.2" class="red anim-chase" style="animation-delay:0s"/>
    <circle cx="283" cy="155" r="2.2" class="red anim-chase" style="animation-delay:.22s"/>
    <circle cx="328" cy="167" r="2.2" class="red anim-chase" style="animation-delay:.44s"/>
    <circle cx="373" cy="179" r="2.2" class="red anim-chase" style="animation-delay:.66s"/>
    <circle cx="418" cy="191" r="2.2" class="red anim-chase" style="animation-delay:.88s"/>

    <circle cx="200" cy="163" r="2.2" class="red anim-chase" style="animation-delay:0s"/>
    <circle cx="200" cy="196" r="2.2" class="red anim-chase" style="animation-delay:.22s"/>
    <circle cx="200" cy="229" r="2.2" class="red anim-chase" style="animation-delay:.44s"/>
    <circle cx="200" cy="262" r="2.2" class="red anim-chase" style="animation-delay:.66s"/>
    <circle cx="200" cy="295" r="2.2" class="red anim-chase" style="animation-delay:.88s"/>

    <circle cx="554" cy="200" r="2.2" class="red anim-chase" style="animation-delay:0s"/>
    <circle cx="593" cy="200" r="2.2" class="red anim-chase" style="animation-delay:.22s"/>
    <circle cx="632" cy="200" r="2.2" class="red anim-chase" style="animation-delay:.44s"/>
    <circle cx="671" cy="200" r="2.2" class="red anim-chase" style="animation-delay:.66s"/>
    <circle cx="710" cy="200" r="2.2" class="red anim-chase" style="animation-delay:.88s"/>

    <circle cx="272" cy="342" r="2.2" class="red anim-chase" style="animation-delay:0s"/>
    <circle cx="356" cy="321" r="2.2" class="red anim-chase" style="animation-delay:.22s"/>
    <circle cx="440" cy="300" r="2.2" class="red anim-chase" style="animation-delay:.44s"/>
    <circle cx="524" cy="279" r="2.2" class="red anim-chase" style="animation-delay:.66s"/>
    <circle cx="608" cy="258" r="2.2" class="red anim-chase" style="animation-delay:.88s"/>

    <circle cx="828" cy="200" r="2.4" class="red anim-chase" style="animation-delay:0s"/>
    <circle cx="860" cy="200" r="2.4" class="red anim-chase" style="animation-delay:.22s"/>
    <circle cx="892" cy="200" r="2.4" class="red anim-chase" style="animation-delay:.44s"/>
    <circle cx="924" cy="200" r="2.4" class="red anim-chase" style="animation-delay:.66s"/>
    <circle cx="956" cy="200" r="2.4" class="red anim-chase" style="animation-delay:.88s"/>
  </g>

  <g class="mono">
    <rect x="126" y="107" width="148" height="46" fill="#0D0D0D" stroke="#2B2B2B"/>
    <text x="200" y="128" text-anchor="middle" class="mono lit" font-size="13" letter-spacing="1.5">SOFTWARE</text>
    <text x="200" y="145" text-anchor="middle" class="mono dim" font-size="9" letter-spacing="1">STABLE</text>

    <rect x="446" y="177" width="148" height="46" fill="#0D0D0D" stroke="#2B2B2B"/>
    <text x="520" y="198" text-anchor="middle" class="mono lit" font-size="12" letter-spacing="1">DISTRIBUTED</text>
    <text x="520" y="215" text-anchor="middle" class="mono dim" font-size="9" letter-spacing="1">STABLE</text>

    <rect x="126" y="327" width="148" height="46" fill="#0D0D0D" stroke="#2B2B2B"/>
    <text x="200" y="348" text-anchor="middle" class="mono lit" font-size="13" letter-spacing="1.5">DATA</text>
    <text x="200" y="365" text-anchor="middle" class="mono dim" font-size="9" letter-spacing="1">STABLE</text>

    <circle cx="800" cy="200" r="30" fill="none" stroke="#E61919" opacity=".5"/>
    <circle cx="800" cy="200" r="30" fill="none" stroke="#E61919" class="anim-pulse"/>
    <rect x="726" y="177" width="148" height="46" fill="#1A0A0A" stroke="#E61919"/>
    <text x="800" y="198" text-anchor="middle" class="mono lit" font-size="13" font-weight="600" letter-spacing="1.5">AI</text>
    <text x="800" y="215" text-anchor="middle" class="mono red" font-size="9" letter-spacing="1.5">ACTIVE</text>

    <rect x="956" y="177" width="148" height="46" fill="#1A0A0A" stroke="#E61919"/>
    <text x="1030" y="198" text-anchor="middle" class="mono lit" font-size="13" font-weight="600" letter-spacing="1.5">AGENTS</text>
    <text x="1030" y="215" text-anchor="middle" class="mono red" font-size="9" letter-spacing="1.5">ACTIVE</text>
  </g>

  <text x="52" y="432" class="mono dim" font-size="10" letter-spacing="1.5">NODES: 5 · LINKS: 5 · CHANNELS: 2</text>
  <text x="1150" y="432" text-anchor="end" class="mono dim" font-size="10" letter-spacing="1.5">SOFTWARE &#8594; AGENTS</text>
</svg>