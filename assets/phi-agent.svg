  <rect x="62" y="484" width="6" height="6" rx="1.5" fill="#DFA54A" opacity="0.75"/>
  <text x="88" y="492" class="mono soft" font-size="11" letter-spacing="0.4">anti-loop guard</text>

  <rect x="600" y="336" width="540" height="200" rx="10" fill="#0F1114" stroke="#23262B"/>
  <text x="620" y="368" class="mono amber" font-size="11.5" font-weight="600" letter-spacing="1.5">MEMORY + STATE</text>
  <rect x="622" y="394" width="6" height="6" rx="1.5" fill="#DFA54A" opacity="0.75"/>
  <text x="648" y="402" class="mono soft" font-size="11" letter-spacing="0.4">sqlite memory · facts · sessions</text>
  <rect x="622" y="424" width="6" height="6" rx="1.5" fill="#DFA54A" opacity="0.75"/>
  <text x="648" y="432" class="mono soft" font-size="11" letter-spacing="0.4">trajectory persistence</text>
  <rect x="622" y="454" width="6" height="6" rx="1.5" fill="#DFA54A" opacity="0.75"/>
  <text x="648" y="462" class="mono soft" font-size="11" letter-spacing="0.4">remote context policy · default-deny</text>
  <rect x="622" y="484" width="6" height="6" rx="1.5" fill="#DFA54A" opacity="0.75"/>
  <text x="648" y="492" class="mono soft" font-size="11" letter-spacing="0.4">secret redaction · context budgets</text>

  <line x1="40" y1="576" x2="1160" y2="576" class="hair"/>
  <text x="40" y="598" class="mono dim" font-size="11" letter-spacing="0.8">PYTHON · LLAMA.CPP · SQLITE</text>
  <text x="1160" y="598" text-anchor="end" class="mono amber" font-size="11" letter-spacing="1.2">LOCAL-FIRST INFERENCE</text>
