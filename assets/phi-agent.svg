<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="PHI-AGENT runtime architecture - ReAct loop, model router, local and remote inference">
  <defs>
    <style>
      .mono { font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .dim { fill: #838791; }
      .soft { fill: #C9CDD4; }
