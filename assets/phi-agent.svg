  <line x1="40" y1="50" x2="1160" y2="50" class="hair"/>

  <text x="40" y="84" class="mono dim" font-size="11" letter-spacing="1.2">REACT LOOP</text>
  <text x="1160" y="84" text-anchor="end" class="mono dim" font-size="10" letter-spacing="1">LOOP OUTPUT · LOOP_RESULT</text>

  <path d="M 905 116 V 98 H 92 V 116" class="amber" stroke-width="1.5" fill="none" opacity="0.85"/>
  <polygon class="amber" points="86,108 97,108 92,119" opacity="0.85"/>

  <g>
