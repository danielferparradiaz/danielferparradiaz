<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="Daniel Fernando Parra Diaz - engineering lab console">
  <defs>
    <style>
      .mono { font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .dim { fill: #8A8A8A; }
      .mid { fill: #B4B4B4; }
      .lit { fill: #EAEAEA; }
      .red { fill: #E61919; }
      .green { fill: #4AF626; }
      @keyframes blink { 0%,58% { opacity: 1; } 59%,100% { opacity: 0.12; } }
      @keyframes sweep { 0% { opacity: 0; transform: translateY(0); } 8% { opacity: .06; } 92% { opacity: .06; } 100% { opacity: 0; transform: translateY(300px); } }
      @keyframes chip { 0%,64% { opacity: 1; } 65%,100% { opacity: .35; } }
      .anim-blink { animation: blink 1.6s steps(1,end) infinite; }
      .anim-chip { animation: chip 2.4s ease-in-out infinite; }
      .anim-caret { animation: blink 1.1s steps(1,end) infinite; }
      .anim-sweep { animation: sweep 7s cubic-bezier(.2,0,.4,1) infinite; }
      @media (prefers-reduced-motion: reduce) {
        .anim-blink, .anim-chip, .anim-caret, .anim-sweep { animation: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="520" fill="#0A0A0A"/>
  <rect x="1" y="1" width="1198" height="518" fill="none" stroke="#2B2B2B"/>

  <g stroke="#3A3A3A">
    <path d="M 36 30 h 14 M 36 30 v 14 M 36 490 h 14 M 36 490 v -14 M 1164 30 h -14 M 1164 30 v 14 M 1164 490 h -14 M 1164 490 v -14"/>
  </g>

  <g>
    <rect x="42" y="96" width="3" height="300" fill="#4A4A4A"/>
    <rect x="47" y="140" width="2" height="256" fill="#3A3A3A"/>
    <rect x="51" y="96" width="4" height="300" fill="#E61919"/>
    <rect x="57" y="120" width="2" height="276" fill="#4A4A4A"/>
    <rect x="61" y="96" width="5" height="300" fill="#6A6A6A"/>
    <rect x="68" y="150" width="2" height="246" fill="#E61919"/>
    <rect x="72" y="96" width="3" height="300" fill="#3F3F3F"/>
  </g>

  <text x="96" y="32" class="mono dim" font-size="11" letter-spacing="2">DANIEL'S ENGINEERING LAB</text>
  <circle cx="1150" cy="29" r="3" class="green anim-blink"/>
  <text x="1160" y="33" text-anchor="end" class="mono" font-size="11" letter-spacing="1.5" fill="#4AF626">SYS.ONLINE</text>

  <rect x="96" y="50" width="64" height="3" fill="#E61919"/>
  <rect x="96" y="51" width="1064" height="1" fill="#2E2E2E"/>

  <text x="96" y="104" class="mono dim" font-size="12" letter-spacing="1.5">NAME //</text>
  <text x="96" y="178" class="sans" font-size="66" font-weight="600" letter-spacing="-1" fill="#EAEAEA">DANIEL FERNANDO</text>
  <text x="96" y="250" class="sans" font-size="66" font-weight="600" letter-spacing="-1" fill="#EAEAEA">PARRA DIAZ</text>
  <rect x="96" y="266" width="240" height="3" fill="#E61919"/>

  <text x="96" y="306" class="mono red" font-size="12.5" letter-spacing="1" font-weight="600">SOFTWARE ENGINEER</text>
  <text x="96" y="332" class="mono mid" font-size="12.5" letter-spacing="1">DATA &amp; AI ENGINEERING STUDENT</text>

  <text x="96" y="384" class="mono dim" font-size="11.5" letter-spacing="1.5">BUILDING SYSTEMS WHERE SOFTWARE, DATA AND AI MEET</text>
  <text x="96" y="384" class="mono red anim-caret" font-size="12">_</text>

  <text x="820" y="104" class="mono dim" font-size="12" letter-spacing="1.5">FOCUS //</text>

  <g>
    <rect x="820" y="122" width="300" height="30" fill="#0D0D0D" stroke="#2B2B2B"/>
    <text x="836" y="142" class="mono lit" font-size="12" letter-spacing="1">SOFTWARE</text>
    <text x="1102" y="142" class="mono dim" font-size="11" letter-spacing="1">STABLE</text>
    <rect x="820" y="160" width="300" height="30" fill="#0D0D0D" stroke="#2B2B2B"/>
    <text x="836" y="180" class="mono lit" font-size="12" letter-spacing="1">DISTRIBUTED SYSTEMS</text>
    <text x="1102" y="180" class="mono dim" font-size="11" letter-spacing="1">STABLE</text>
    <rect x="820" y="198" width="300" height="30" fill="#0D0D0D" stroke="#2B2B2B"/>
    <text x="836" y="218" class="mono lit" font-size="12" letter-spacing="1">DATA</text>
    <text x="1102" y="218" class="mono dim" font-size="11" letter-spacing="1">STABLE</text>
    <rect x="820" y="236" width="300" height="30" fill="#1A0A0A" stroke="#E61919"/>
    <text x="836" y="256" class="mono lit" font-size="12" letter-spacing="1">AI</text>
    <text x="1102" y="256" class="mono red" font-size="11" letter-spacing="1">ACTIVE</text>
    <rect x="820" y="274" width="300" height="30" fill="#1A0A0A" stroke="#E61919"/>
    <text x="836" y="294" class="mono lit" font-size="12" letter-spacing="1">AGENTS</text>
    <text x="1102" y="294" class="mono red" font-size="11" letter-spacing="1">ACTIVE</text>
  </g>

  <rect x="820" y="330" width="300" height="1" fill="#2E2E2E"/>
  <text x="820" y="360" class="mono red" font-size="11.5" letter-spacing="1.5">CURRENT BUILD // PHI-AGENT</text>
  <text x="820" y="382" class="mono dim" font-size="11" letter-spacing="1">LOCAL AI AGENT RUNTIME</text>
  <rect x="1036" y="346" width="84" height="24" fill="none" stroke="#E61919"/>
  <text x="1078" y="362" text-anchor="middle" class="mono red anim-chip" font-size="11" letter-spacing="1.5">ACTIVE</text>

  <rect x="820" y="420" width="300" height="1" fill="#2E2E2E"/>
  <text x="820" y="446" class="mono dim" font-size="10.5" letter-spacing="1">TELEMETRY V2.1</text>

  <rect x="96" y="460" width="1064" height="1" fill="#2E2E2E"/>
  <text x="96" y="484" class="mono dim" font-size="11" letter-spacing="1">ID · danielferparradiaz</text>
  <text x="1160" y="484" text-anchor="end" class="mono dim" font-size="11" letter-spacing="1">github.com/danielferparradiaz</text>

  <rect class="anim-sweep" x="820" y="420" width="300" height="2" fill="#E61919"/>
</svg>