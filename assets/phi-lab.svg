<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="PHI-AGENT - local AI agent runtime lab card">
  <defs>
    <style>
      .mono { font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .dim { fill: #8A8A8A; }
      .mid { fill: #B4B4B4; }
      .lit { fill: #EAEAEA; }
      .red { fill: #E61919; }
      .green { fill: #4AF626; }
      @keyframes blink { 0%,58% { opacity: 1; } 59%,100% { opacity: 0.12; } }
      .anim-blink { animation: blink 1.6s steps(1,end) infinite; }
      .anim-dot { animation: blink 2.2s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .anim-blink, .anim-dot { animation: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="360" fill="#0A0A0A"/>
  <rect x="1" y="1" width="1198" height="358" fill="none" stroke="#2B2B2B"/>

  <text x="52" y="30" class="mono dim" font-size="10.5" letter-spacing="2">PROJECT 01 · AI.LAB</text>
  <circle cx="1084" cy="29" r="3" class="green anim-dot"/>
  <text x="1150" y="33" text-anchor="end" class="mono green" font-size="10.5" letter-spacing="1.5">LOOP RUNNING</text>

  <text x="52" y="82" class="sans" font-size="34" font-weight="600" letter-spacing="-0.5" fill="#EAEAEA">PHI-AGENT</text>
  <rect x="52" y="96" width="92" height="3" fill="#E61919"/>

  <text x="340" y="80" class="mono dim" font-size="11" letter-spacing="1">LOCAL AI AGENT RUNTIME · PHI-4-MINI ON LLAMA.CPP</text>
  <rect x="1000" y="60" width="66" height="24" fill="none" stroke="#E61919"/>
  <text x="1033" y="76" text-anchor="middle" class="mono red" font-size="11" letter-spacing="1.5">ACTIVE</text>

  <g class="mono">
    <rect x="40" y="130" width="300" height="96" fill="#0D0D0D" stroke="#2B2B2B"/>
    <text x="60" y="158" class="mono red" font-size="11" letter-spacing="1.5">MODEL</text>
    <text x="60" y="184" class="mono mid" font-size="10.5" letter-spacing="0.5">phi-4-mini (gguf)</text>
    <text x="60" y="204" class="mono mid" font-size="10.5" letter-spacing="0.5">llama-server · ollama</text>

    <text x="368" y="178" class="mono red" font-size="15" fill="#E61919">&#9654;</text>

    <rect x="430" y="130" width="340" height="96" fill="#0D0D0D" stroke="#2B2B2B"/>
    <text x="450" y="158" class="mono red" font-size="11" letter-spacing="1.5">RUNTIME</text>
    <text x="450" y="184" class="mono mid" font-size="10.5" letter-spacing="0.5">policy · validator · circuit breaker</text>
    <text x="450" y="204" class="mono mid" font-size="10.5" letter-spacing="0.5">sqlite memory · model router</text>

    <text x="778" y="178" class="mono red" font-size="15" fill="#E61919">&#9654;</text>

    <rect x="820" y="130" width="340" height="96" fill="#1A0A0A" stroke="#E61919"/>
    <text x="840" y="158" class="mono red" font-size="11" letter-spacing="1.5">TOOLS</text>
    <text x="840" y="184" class="mono mid" font-size="10.5" letter-spacing="0.5">execute · observe · trajectories</text>
    <text x="840" y="204" class="mono mid" font-size="10.5" letter-spacing="0.5">risk gates · default-deny context</text>
  </g>

  <text x="52" y="268" class="mono dim" font-size="10.5" letter-spacing="1">ReAct loop · tool-risk metadata · human confirmation · anti-loop guard</text>

  <line x1="40" y1="300" x2="1160" y2="300" stroke="#2E2E2E"/>
  <text x="52" y="326" class="mono dim" font-size="10.5" letter-spacing="1">WIP · MCP PLUMBING + OFFLINE LEARNING</text>
  <text x="1150" y="326" text-anchor="end" class="mono red" font-size="11" letter-spacing="1.5">VIEW PROJECT &#8594;</text>
</svg>