<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-label="Activity trace - stylized contribution signal grid">
  <defs>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39D353" stop-opacity=".55"/>
      <stop offset="0.5" stop-color="#39D353" stop-opacity=".25"/>
      <stop offset="1" stop-color="#39D353" stop-opacity="0"/>
    </linearGradient>
    <style>
      .mono { font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace; }
      .dim { fill: #8A8A8A; }
      .mid { fill: #B4B4B4; }
      .lit { fill: #EAEAEA; }
      .red { fill: #E61919; }
      .green { fill: #4AF626; }
      @keyframes sweep { 0% { transform: translateX(0); opacity: 0; } 6% { opacity: 1; } 94% { opacity: 1; } 100% { transform: translateX(760px); opacity: 0; } }
      @keyframes blink { 0%,55% { opacity: 1; } 56%,100% { opacity: 0; } }
      @keyframes glow { 0%,100% { opacity: .3; } 50% { opacity: 1; } }
      .anim-sweep { animation: sweep 5.5s cubic-bezier(.2,0,.4,1) infinite; transform-box: fill-box; transform-origin: left center; }
      .anim-blink { animation: blink 1.6s steps(1,end) infinite; }
      .anim-glow { animation: glow 2.6s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .anim-sweep, .anim-blink, .anim-glow { animation: none; }
        .anim-sweep { opacity: 0; }
      }
    </style>
  </defs>

  <rect width="1200" height="240" fill="#0A0A0A"/>
  <rect x="1" y="1" width="1198" height="238" fill="none" stroke="#2B2B2B"/>

